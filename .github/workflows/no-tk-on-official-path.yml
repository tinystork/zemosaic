name: no-tk-on-official-path

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install minimal deps for import gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy psutil astropy reproject photutils scipy opencv-python-headless PySide6
      - name: Official-path Tk import regression guard
        run: |
          # Block only direct tkinter imports in official-path modules.
          ! grep -RInE -- "^[[:space:]]*(import[[:space:]]+tkinter|from[[:space:]]+tkinter[[:space:]]+import)" src/zemosaic/zemosaic_config.py src/zemosaic/zemosaic_gui_qt.py src/zemosaic/zemosaic_filter_gui_qt.py
      - name: Headless import gates
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -c "import zemosaic.zemosaic_config"
          python -c "import zemosaic.zemosaic_worker"
      - name: Ensure --tk-gui does not fallback
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python - <<'PY'
          import run_zemosaic
          from zemosaic._app import _determine_backend
          backend, cleaned, _ = _determine_backend(['--tk-gui'])
          assert backend == 'qt', backend
          assert '--tk-gui' not in cleaned, cleaned
          assert run_zemosaic.main is not None
          PY
