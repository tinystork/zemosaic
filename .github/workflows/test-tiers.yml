name: test-tiers

on:
  pull_request:
    branches: [beta]
  schedule:
    # Nightly full non-gated run (fast tier, everything except the slow/corpus-gated tests).
    - cron: '17 3 * * *'

jobs:
  fast-tier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt/X11 system libraries (headless PySide6 imports)
        # The GUI test modules import PySide6.QtGui; the runner image lacks the
        # system libs (libEGL/libGL/xkbcommon/dbus), which would turn 5 modules
        # into collection ERRORS. Install the minimal set so they run headless.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install the package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Fast tier (loop gate — no local corpora; gated tests skip)
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest -m "not slow" -q
